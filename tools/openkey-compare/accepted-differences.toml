# Differences that are accepted: a run passes only when every difference it finds is listed here and no entry
# here has gone stale (it matches nothing in a run that typed what it names).
#
# Each entry pins one divergence:
#   source    the corpus file (telex, vni, simple_telex, english, sentences, macros), convert, or random
#   sequence  the line as the corpus file or convert.txt writes it, or the random sequence as the report writes it
#   settings  setting tokens that must all hold: a method (telex, vni, simple-telex), a table (unicode, tcvn3,
#             vni-windows, unicode-compound, cp1258), a language (vietnamese, english), a toggle that is on
#             (spell-check, restore, modern-tones, quick-telex, quick-first, quick-last, capitals, macros,
#             macros-in-english, match-caps), or ! and a toggle that is off; for convert, from- and to- a table
#             (from-unicode, to-cp1258), a case (keep, upper, lower, sentence-start, each-word), and
#             remove-accents or !remove-accents; the report prints the tokens an entry's runs all match
#   step      the key after which the texts differ, counting from 1 (the Space after a corpus line counts too);
#             1 for convert
#   expected  OpenKey's text and CuaKey's, as the report writes them: the text for Unicode, the code units in hex
#   cuakey    for any other table, and (error) for a conversion that makes OpenKey stop with an error
#   reason    why the difference is accepted, in terms of behaviour
#
# An accepted difference does not end its run: the corrected host's text box takes CuaKey's text, and the run
# goes on, so a later difference in the same line is still found.
#
# Differences that come from OpenKey's Windows host are not listed here: the comparison holds CuaKey to OpenKey's
# engine applied by a corrected host, and the report counts the host's defects in a section of their own.

[[accepted]]
source = "telex"
sequence = "dddd"
settings = ""
step = 4
expected = "dđ"
cuakey = "ddd"
reason = "A third d takes the stroke back and the word goes on as typed, as a third a, e, o or w does in OpenKey too; a fourth d should stay a d, not stroke again."

[[accepted]]
source = "telex"
sequence = "ddd<bs>di"
settings = "!spell-check"
step = 5
expected = "đ"
cuakey = "dd"
reason = "Without spell check a word typed as it is stays so through Backspace, as vieee<bs>e and ass<bs>s do in OpenKey too; only the d stroke comes back there, and a typist expects one rule for every mark key."

[[accepted]]
source = "telex"
sequence = "tieengs<bs><bs>s"
settings = "restore"
step = 11
expected = "tieen "
cuakey = "tiees "
reason = "Restore types back the keys of what the screen shows; it must not bring back the n the typist deleted, so tiees, not tieen."

[[accepted]]
source = "telex"
sequence = "nguwowif<bs>f"
settings = "restore"
step = 11
expected = "nguwowi "
cuakey = "nguwowf "
reason = "Restore types back the keys of what the screen shows; it must not bring back the i the typist deleted, nor drop the f typed last."

[[accepted]]
source = "telex"
sequence = "vie1etj"
settings = "spell-check"
step = 7
expected = "vie1etj"
cuakey = "vie1ẹt"
reason = "In Telex a digit is no typing key, so the letters after it compose a word of their own, as in lần2 or 2ngày; OpenKey keeps the digit in the word and with spell check leaves every letter after it raw."

[[accepted]]
source = "vni"
sequence = "u7u7"
settings = ""
step = 4
expected = "ưu"
cuakey = "uu7"
reason = "The second 7 changes nothing on screen and does not type itself, so the keystroke is lost; everywhere else a mark key typed again takes its mark back and types itself, as u77 gives u7."

[[accepted]]
source = "simple_telex"
sequence = "ddd<bs>di"
settings = "!spell-check"
step = 5
expected = "đ"
cuakey = "dd"
reason = "Without spell check a word typed as it is stays so through Backspace, as vieee<bs>e and ass<bs>s do in OpenKey too; only the d stroke comes back there, and a typist expects one rule for every mark key."

[[accepted]]
source = "english"
sequence = "were"
settings = "telex"
step = 4
expected = "uể"
cuakey = "ưể"
reason = "The w made ư; OpenKey drops that horn only when the tone moves onto the ê (week keeps ưê), so the letter changes because of where the tone sits, not because of any key."

[[accepted]]
source = "english"
sequence = "year"
settings = "modern-tones"
step = 4
expected = "ỷea"
cuakey = "yẻa"
reason = "yea is no Vietnamese vowel group; the old style puts its tone on the middle vowel in both engines, and the new style moves a tone only within oa, oe and uy, none of which yea holds."

[[accepted]]
source = "english"
sequence = "week"
settings = "telex spell-check restore quick-last"
step = 5
expected = "ưêch "
cuakey = "week "
reason = "ưê is no Vietnamese vowel group, only uê is, so spell check must not take ưêch for a syllable: with restore the typist gets the English word back, and without it quick last writes ch out only where that makes a Vietnamese word."

[[accepted]]
source = "english"
