# Types the same keys into CuaKey's typing engine and into OpenKey's, and reports where the text on screen differs.
# A Cargo project of its own, outside the repository's workspace and its gates, so its versions live here.
[package]
name = "openkey-compare"
description = "Compares CuaKey's typing with OpenKey's, key by key, as a black box."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
cuakey-domain = { path = "../../services/cuakey/domain" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[build-dependencies]
cc = "1.11.3"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mod_module_files = "deny"
