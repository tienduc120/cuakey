[package]
name = "cuakey-desktop"
description = "The composition root: wires adapters to use cases and starts the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cuakey"
path = "src/main.rs"

[dependencies]
cuakey-application = { path = "../application" }
cuakey-interfaces = { path = "../interfaces" }
thiserror = { workspace = true, features = ["std"] }

# The app runs on Windows only for now; elsewhere `main` starts nothing and exits with a failure.
[target.'cfg(windows)'.dependencies]
cuakey-infrastructure = { path = "../infrastructure" }
eframe = { workspace = true }
platform-clock = { workspace = true }
platform-windows = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[lints]
workspace = true
