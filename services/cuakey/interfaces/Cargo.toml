[package]
name = "cuakey-interfaces"
description = "What this service shows the user: the only place an outcome becomes a message on screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cuakey-application = { path = "../application" }
egui = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

# The file dialogs are the Windows ones; elsewhere rfd's Wayland backend needs system libraries the build lacks.
[target.'cfg(windows)'.dependencies]
rfd = { workspace = true }

[lints]
workspace = true
