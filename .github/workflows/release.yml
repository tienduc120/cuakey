# Protected. Builds the Windows zip and the Microsoft Store package when a version tag is pushed (ADR-0017). The zip is
# published unsigned; the package is kept as a workflow artifact for the maintainer to upload to Partner Center, where
# the Store signs it.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show

      # No build cache here: a release must not restore a cache other workflows can write.
      - name: Build
        run: cargo build --release --locked -p cuakey-desktop

      - name: Package the zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $dir = "cuakey-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/cuakey.exe, README.md, LICENSE -Destination $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      # The package carries the workspace version, so a tag that differs from it would ship under the wrong number.
      - name: Package for the Store
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo xtask msix
          if (-not (Test-Path "target/msix/cuakey-$env:TAG-x64.msix")) { throw "the tag $env:TAG is not the workspace version" }

      # Unsigned, it installs nowhere but through the Store, so it is not a release asset.
      - name: Keep the Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuakey-store-package
          path: target/msix/cuakey-${{ github.ref_name }}-x64.msix
          if-no-files-found: error
          retention-days: 30

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" "cuakey-$env:TAG-windows-x64.zip" --generate-notes
