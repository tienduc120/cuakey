[package]
name = "platform-windows"
description = "Windows itself, behind safe functions: the one crate allowed unsafe code, for Win32 and COM (ADR-0014)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
platform-clock = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

# The bindings only build for Windows, so the modules that use them do too.
[target.'cfg(windows)'.dependencies]
platform-task = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true, features = [
  "ApplicationModel",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
