# Spelling check for code, comments, and docs (crate-ci/typos). Protected.
[files]
# The comparison corpus is raw key sequences (Telex, VNI), not words.
extend-exclude = ["target/", "*.lock", "LICENSES/", ".xtask/", "tools/openkey-compare/corpus/"]

[default]
# An accepted comparison difference names keys and texts the same way; its reason is prose and is still checked.
extend-ignore-re = ['(?m)^(sequence|expected|cuakey) = ".*"$']

[default.extend-words]
# Vietnamese words that read as English typos.
thay = "thay"
Tham = "Tham"
Nam = "Nam"
# The Win32 prefix of the notification-area events (NIN_SELECT, NIN_KEYSELECT).
NIN = "NIN"
